<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111">
<title>Meranie balíka</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
  #start { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; text-align: center; gap: 16px; }
  #start h1 { margin: 0; font-size: 26px; }
  #start p { margin: 0; color: #bbb; max-width: 420px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 22px; background: #ffcc00; color: #111; font-weight: 700; }
  button.sec { background: rgba(255,255,255,.18); color: #fff; }
  button:disabled { opacity: .4; }
  #err { color: #ff7a7a; max-width: 420px; }
  #overlay { position: fixed; inset: 0; display: none; }
  #overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint { position: absolute; top: 12px; left: 12px; right: 12px; padding: 10px 14px; border-radius: 12px; background: rgba(0,0,0,.6); text-align: center; font-size: 15px; }
  #live { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.6); font: 700 22px/1.2 ui-monospace, monospace; display: none; white-space: nowrap; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #result { position: absolute; left: 16px; right: 16px; top: 30%; padding: 18px; border-radius: 16px; background: rgba(20,20,20,.95); display: none; text-align: center; }
  .cat { display: inline-block; padding: 4px 16px; border-radius: 10px; color: #111; font: 800 26px/1.2 system-ui; }
  .cat.small { font-size: 12px; padding: 1px 6px; border-radius: 6px; }
  #catsum { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  #result .dims { font: 700 30px/1.2 ui-monospace, monospace; margin: 8px 0; }
  #result .sub { color: #bbb; font-size: 14px; }
  #result .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #mode { position: absolute; top: 70px; right: 12px; font-size: 13px; padding: 8px 12px; }
  #diag { position: absolute; left: 12px; right: 12px; bottom: 84px; text-align: center; font: 12px ui-monospace, monospace; color: #ccc; text-shadow: 0 0 3px #000; }
  #act.ok { background: #3ddc84; }
  #count { position: absolute; top: 70px; left: 12px; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.6); }
  #result .coderow { display: flex; gap: 8px; margin-top: 12px; }
  #result .coderow input { margin-top: 0; flex: 1; }
  #result .coderow button { padding: 0 16px; font-size: 22px; }
  #dupwarn { display: none; margin-top: 8px; color: #ff9800; font-size: 14px; }
  #scan { position: fixed; inset: 0; display: none; background: #000; z-index: 10; }
  #scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay.noar > *:not(#result) { display: none !important; }
  #overlay.noar { background: #111; }
  #scanframe { position: absolute; left: 8%; right: 8%; top: 32%; height: 22%; border: 3px solid #ffcc00; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
  #scanframe::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #ff5252; animation: scanline 1.6s ease-in-out infinite; }
  @keyframes scanline { 0%, 100% { transform: translateY(-40px); } 50% { transform: translateY(40px); } }
  #scanhint { position: absolute; left: 12px; right: 12px; top: 18%; text-align: center; padding: 10px; border-radius: 12px; background: rgba(0,0,0,.6); }
  #scanbar { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; gap: 10px; justify-content: center; }
  #scanbar button.on { background: #ffcc00; color: #111; }
  #result input { width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #222; color: #fff; font: inherit; }
  #log { width: 100%; max-width: 520px; display: none; flex-direction: column; gap: 10px; }
  #log .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #log .btns button { padding: 10px 14px; font-size: 14px; }
  #logtable { max-height: 35vh; overflow: auto; border-radius: 10px; background: #1c1c1c; }
  #logtable table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #logtable th, #logtable td { padding: 6px 8px; border-bottom: 1px solid #333; text-align: right; white-space: nowrap; }
  #logtable th:nth-child(2), #logtable td:nth-child(2) { text-align: left; }
</style>
</head>
<body>
<div id="start">
  <h1>📦 Meranie balíka</h1>
  <p>Polož balík na zem, spusti meranie a nasleduj pokyny. Aplikácia nájde krabicu automaticky pomocou hĺbkovej kamery (ARCore).</p>
  <button id="go" disabled>Spustiť meranie</button>
  <div id="err"></div>
  <div id="log">
    <b id="logsum"></b>
    <div id="catsum"></div>
    <div id="logtable"></div>
    <div class="btns">
      <button id="exp">⬇ Export (Excel)</button>
      <button id="share" class="sec">Zdieľať</button>
      <button id="clear" class="sec">Vymazať</button>
    </div>
  </div>
  <p style="font-size:13px">Vyžaduje Android, Chrome a <i>Google Play Services for AR</i>.</p>
</div>

<div id="scan">
  <video id="vid" playsinline muted autoplay></video>
  <div id="scanhint">Namier rámik na čiarový alebo QR kód na štítku</div>
  <div id="scanframe"></div>
  <div id="scanbar">
    <button id="torch" class="sec" style="display:none">🔦</button>
    <button id="zoom" class="sec" style="display:none">2×</button>
    <button id="scancancel" class="sec">Zrušiť</button>
  </div>
</div>

<div id="overlay">
  <canvas id="c2d"></canvas>
  <div id="hint">Inicializujem…</div>
  <button id="mode" class="sec">Ručný režim</button>
  <div id="count"></div>
  <div id="live"></div>
  <div id="diag"></div>
  <div id="bar">
    <button id="act">Nastaviť podlahu</button>
    <button id="reset" class="sec">Znova</button>
    <button id="exit" class="sec">Koniec</button>
  </div>
  <div id="result">
    <div class="sub">Rozmery balíka (D × Š × V)</div>
    <div id="rcat" class="cat"></div> <div id="rshape" class="cat" style="background:#ddd;display:none">⬭ valec</div>
    <div class="dims" id="rdims"></div>
    <div class="sub" id="rsub"></div>
    <div class="coderow">
      <input id="code" placeholder="Číslo balíka" autocomplete="off" inputmode="text">
      <button id="scanbtn" class="sec" title="Skenovať kód">📷</button>
    </div>
    <div id="dupwarn"></div>
    <input id="note" placeholder="Poznámka (nepovinné)" autocomplete="off">
    <div class="row">
      <button id="discard" class="sec">Zahodiť</button>
      <button id="save">Uložiť a merať ďalší</button>
    </div>
  </div>
</div>

<script src="measure.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const M = window.Measure;

// ---------- nastavenia ----------
const GRID_COLS = 64, GRID_ROWS = 112;   // vzorkovanie hĺbkovej mapy
const HISTORY = 25;                        // počet snímok pre medián
const FINAL_SAMPLES = 8;                   // snímky zbierané po stlačení "Zmerať" (ak ešte nie je dosť histórie)
const STABLE_N = 8;                        // počet po sebe idúcich zhodných snímok = "stabilné"
const STABLE_TOL = 0.015;                  // max. rozptyl rozmeru pre "stabilné" (m)
const DIST_MIN = 0.45, DIST_MAX = 1.3;     // odporúčaná vzdialenosť od balíka (m)
// dlhý balík (napr. stočený matrac) sa do záberu zmestí len z väčšej diaľky
const distMax = () => latest ? Math.max(DIST_MAX, 1.8 * latest.length + 0.3) : DIST_MAX;

// ---------- stav ----------
let session, refSpace, viewerSpace, hitSource, gl;
let depthOK = false;
let floorY = null;          // výška podlahy vo svete
let lastHit = null;         // posledný horizontálny zásah
let history = [];           // posledné detekcie
let latest = null;          // posledná detekcia (na kreslenie)
let collecting = null;      // pole meraní počas finálneho zberu
let frozen = null;          // finálny výsledok
let manual = false;         // ručný režim
let stable = false;         // rozmery sú ustálené (indikácia na tlačidle)
let rejects = 0, lastSeen = -999, boxDist = null;
let floorCand = [];         // kandidáti výšky podlahy (auto-nastavenie)
let floorSrc = '';          // odkiaľ je podlaha: rovina / hĺbka
let depthFrames = 0, depthValid = 0;
let manualPts = [];         // ručné body [x,y,z]
let frameNo = 0;
let lastView = null;        // {proj, viewInv}

const ctx = $('c2d').getContext('2d');

// ---------- podpora ----------
(async () => {
  if (!window.isSecureContext) return fail('Stránka musí byť otvorená cez HTTPS.');
  if (!navigator.xr) return fail('Tento prehliadač nepodporuje WebXR. Použi Chrome na Androide.');
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    if (!ok) return fail('AR nie je na tomto zariadení podporované (chýba ARCore?).');
    $('go').disabled = false;
  } catch (e) { fail('Chyba pri overovaní AR: ' + e.message); }
})();
function fail(msg) { $('err').textContent = msg; }

$('go').onclick = start;
$('exit').onclick = () => session && session.end();
$('reset').onclick = resetAll;
$('save').onclick = () => {
  const dup = findDup($('code').value);
  if (dup && !$('save').dataset.sure) {
    $('save').dataset.sure = 1; $('save').textContent = 'Uložiť aj tak';
    showDup(dup, true); return;
  }
  saveRecord(); resetMeasure(); resumeAR();
};
$('code').oninput = () => { showDup(findDup($('code').value)); };
$('scanbtn').onclick = startScan;
$('scancancel').onclick = () => closeScanner(null);
$('torch').onclick = () => setTorch(!torchOn);
$('zoom').onclick = () => setZoom(zoomOn ? 1 : 2);
$('discard').onclick = () => { resetMeasure(); resumeAR(); };
$('exp').onclick = exportCSV;
$('share').onclick = shareCSV;
$('clear').onclick = () => {
  if (!records.length) return;
  if ($('clear').dataset.sure) { records = []; persist(); renderLog(); }
  else { $('clear').dataset.sure = 1; $('clear').textContent = 'Naozaj vymazať?'; setTimeout(() => { delete $('clear').dataset.sure; $('clear').textContent = 'Vymazať'; }, 3000); }
};
$('mode').onclick = () => { manual = !manual; resetMeasure(); updateUI(); };
$('act').onclick = onAction;

// ---------- spustenie session ----------
async function start() {
  $('err').textContent = '';
  const base = { requiredFeatures: ['hit-test', 'dom-overlay'], domOverlay: { root: $('overlay') } };
  // Chrome postupne menil názvy formátov hĺbky – skúsime viac variantov.
  const depthVariants = [
    { usagePreference: ['cpu-optimized'], dataFormatPreference: ['luminance-alpha', 'float32'] },
    { usagePreference: ['cpu-optimized'], dataFormatPreference: ['unsigned-short', 'float32'] },
    { usagePreference: ['cpu-optimized'], dataFormatPreference: ['float32'] },
  ];
  let lastErr;
  for (const ds of depthVariants) {
    try {
      session = await navigator.xr.requestSession('immersive-ar', Object.assign({}, base, { optionalFeatures: ['depth-sensing'], depthSensing: ds }));
      break;
    } catch (e) { lastErr = e; }
  }
  if (!session) {
    try { session = await navigator.xr.requestSession('immersive-ar', base); }
    catch (e) { return fail('Nepodarilo sa spustiť AR: ' + (e.message || lastErr)); }
  }
  depthOK = !!(session.enabledFeatures ? session.enabledFeatures.includes('depth-sensing') : session.depthUsage);
  if (!depthOK) manual = true;

  const canvas = document.createElement('canvas');
  gl = canvas.getContext('webgl', { xrCompatible: true, alpha: true });
  await session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
  refSpace = await session.requestReferenceSpace('local');
  viewerSpace = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewerSpace });

  $('start').style.display = 'none';
  $('overlay').style.display = 'block';
  resize();
  window.addEventListener('resize', resize);
  session.addEventListener('end', () => {
    if (afterEnd) { const f = afterEnd; afterEnd = null; session = null; f(); return; }   // AR vypnuté kvôli skenovaniu
    $('overlay').classList.remove('noar');
    $('overlay').style.display = 'none';
    $('start').style.display = 'flex';
    session = null; resetAll(); renderLog();
  });
  resetAll();
  session.requestAnimationFrame(onFrame);
}

function resize() {
  const c = $('c2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resetAll() { floorY = null; floorCand = []; floorSrc = ''; resetMeasure(); }
function resetMeasure() {
  history = []; latest = null; collecting = null; frozen = null; manualPts = []; rejects = 0; boxDist = null; stable = false;
  $('act').classList.remove('ok');
  $('result').style.display = 'none';
  $('note').value = ''; $('code').value = ''; showDup(null);
  delete $('save').dataset.sure; $('save').textContent = 'Uložiť a merať ďalší';
  if (scanOpen) closeScanner(null);
  updateUI();
}

// ---------- tlačidlo akcie ----------
function onAction() {
  if (manual) {
    const p = targetPoint();
    if (!p) { flash('Pod krížikom nie je rozpoznaný povrch – pomaly hýb telefónom.'); return; }
    manualPts.push(p.slice());
    if (navigator.vibrate) navigator.vibrate(40);
    if (manualPts.length === 4) finishManual();
    updateUI(); return;
  }
  if (floorY === null) {
    const g = lastHit ? lastHit[1] : floorGuess();
    if (g === null) return;
    setFloor(g, lastHit ? 'rovina' : 'hĺbka');
    return;
  }
  if (!collecting && latest) {
    if (history.length >= 5) showResult(M.aggregate(history.slice(-STABLE_N)));
    else { collecting = []; updateUI(); }
  }
}

function manualFloor() { return (manualPts[0][1] + manualPts[1][1] + manualPts[2][1]) / 3; }
function finishManual() {
  const [a, b, c, t] = manualPts;
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[2] - q[2]);
  const L = dist(a, b), W = dist(b, c), H = t[1] - manualFloor();
  showResult({ length: Math.max(L, W), width: Math.min(L, W), height: H, samples: 1 });
}

function showResult(r) {
  frozen = r;
  frozen.mode = manual ? 'ručný' : 'automatický';
  frozen.shape = manual ? '' : (r.shape || 'krabica');
  frozen.time = new Date();
  const cm = v => Math.round(v * 100);
  const L = cm(r.length), W = cm(r.width), H = cm(r.height);
  $('rdims').textContent = `${L} × ${W} × ${H} cm`;
  const cat = M.categorize(L, W, H);
  $('rcat').textContent = cat.id; $('rcat').style.background = cat.color;
  $('rshape').style.display = r.shape === 'valec' ? 'inline-block' : 'none';
  const vol = (L * W * H) / 1000;
  const cyl = r.shape === 'valec' ? ` (valec ≈ ${(Math.PI / 4 * vol).toFixed(1).replace('.', ',')} l)` : '';
  $('rsub').textContent = `Objem ${vol.toFixed(1).replace('.', ',')} l${cyl} · objemová hmotnosť ${(L * W * H / 5000).toFixed(1).replace('.', ',')} kg (÷5000)` +
    (r.samples > 1 ? ` · ${r.samples} snímok` : '');
  $('result').style.display = 'block';
  updateUI();
}

let flashMsg = '', flashT = 0;
function flash(m) { flashMsg = m; clearTimeout(flashT); updateUI(); flashT = setTimeout(() => { flashMsg = ''; updateUI(); }, 2500); }

function updateUI() {
  const act = $('act'), hint = $('hint');
  $('mode').textContent = manual ? 'Automatický režim' : 'Ručný režim';
  $('mode').style.display = depthOK ? '' : 'none';
  $('live').style.display = 'none';
  $('count').textContent = `Uložené: ${records.length}`;
  if (frozen) { hint.textContent = 'Hotovo. Ulož meranie alebo ho zahoď.'; act.style.display = 'none'; return; }
  act.style.display = '';
  if (manual) {
    const steps = ['1. roh balíka dole pri zemi', '2. roh dole (susedný)', '3. roh dole (susedný k 2.)', 'vrch balíka (kdekoľvek na hornej stene)'];
    hint.textContent = flashMsg || `Ručný režim ${manualPts.length + 1}/4: zamier krížik na ${steps[manualPts.length]} a stlač Bod.` +
      (depthOK ? '' : ' (Zariadenie nepodporuje hĺbkovú mapu – body len z rozpoznaných plôch.)');
    act.textContent = 'Bod'; act.disabled = false; return;
  }
  if (floorY === null) {
    hint.textContent = 'Namier na voľnú podlahu vedľa balíka (asi 1 m pred sebou) a pomaly hýb telefónom do strán. Podlaha sa nastaví sama.';
    act.textContent = 'Nastaviť podlahu'; act.disabled = !lastHit && !floorGuess(); return;
  }
  if (collecting) { hint.textContent = 'Meriam… drž telefón v kľude.'; act.disabled = true; act.textContent = 'Meriam…'; return; }
  let h;
  if (!latest) h = 'Namier krížik na balík zo vzdialenosti ~0,5–1 m, šikmo zhora (cca 45°). Celý balík a kúsok podlahy okolo musia byť v zábere.';
  else if (latest.cut) h = '↔ Balík nie je celý v zábere – odstúp, alebo otoč telefón tak, aby balík išiel pozdĺž obrazovky.';
  else if (boxDist !== null && boxDist < DIST_MIN) h = '⬆ Si príliš blízko – odstúp, celý balík musí byť v zábere.';
  else if (boxDist !== null && boxDist > distMax()) h = '⬇ Si príliš ďaleko – podíď bližšie (0,5–1 m).';
  else h = stable ? 'Rozmery sú stabilné ✓ – ak rámik sedí na balíku, stlač Zmerať.' : 'Balík nájdený – drž telefón chvíľu v kľude, kým tlačidlo nezozelenie.';
  hint.textContent = h;
  act.classList.toggle('ok', !!latest && stable);
  act.textContent = 'Zmerať'; act.disabled = !latest;
}

// ---------- skenovanie čiarových / QR kódov ----------
// Počas AR má kamera pevné zaostrenie (ARCore) -> na skenovanie sa AR vypne a použije sa bežný
// fotoaparát s automatickým zaostrovaním a vyšším rozlíšením. Po uložení sa AR spustí znova.
let detector = null, scanOpen = false, stream = null, track = null, torchOn = false, zoomOn = false, afterEnd = null;
const BARCODE_FORMATS = ['code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'itf', 'upc_a', 'upc_e', 'data_matrix', 'qr_code', 'pdf417', 'aztec'];

async function getDetector() {
  if (detector) return detector;
  if (!('BarcodeDetector' in window)) return null;
  let formats = BARCODE_FORMATS;
  try { const sup = await BarcodeDetector.getSupportedFormats(); formats = BARCODE_FORMATS.filter(f => sup.includes(f)); } catch (e) {}
  if (!formats.length) return null;
  detector = new BarcodeDetector({ formats });
  return detector;
}

async function startScan() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { flashResult('Prehliadač nemá prístup ku kamere. Zadaj číslo ručne.'); return; }
  if (!(await getDetector())) { flashResult('Prehliadač nepodporuje čítanie kódov. Zadaj číslo ručne.'); return; }
  if (session) { afterEnd = openScanner; session.end(); }   // výsledok merania ostáva uložený vo „frozen“
  else openScanner();
}

async function openScanner() {
  $('overlay').classList.add('noar'); $('overlay').style.display = 'block'; $('start').style.display = 'none';
  $('result').style.display = 'none';
  $('scan').style.display = 'block';
  $('scanhint').textContent = 'Zapínam fotoaparát…';
  scanOpen = true; torchOn = false; zoomOn = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    closeScanner(null); flashResult('Fotoaparát sa nepodarilo zapnúť (' + (e.name || e.message) + '). Zadaj číslo ručne.'); return;
  }
  if (!scanOpen) { stream.getTracks().forEach(t => t.stop()); return; }
  track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const adv = [];
  if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
  if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.push({ exposureMode: 'continuous' });
  if (adv.length) { try { await track.applyConstraints({ advanced: adv }); } catch (e) {} }
  $('torch').style.display = caps.torch ? '' : 'none';
  $('zoom').style.display = caps.zoom && caps.zoom.max >= 2 ? '' : 'none';
  $('torch').classList.remove('on'); $('zoom').classList.remove('on');
  const v = $('vid'); v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  $('scanhint').textContent = 'Namier rámik na čiarový alebo QR kód na štítku';
  scanLoop();
}

async function scanLoop() {
  const v = $('vid');
  while (scanOpen) {
    if (v.readyState >= 2) {
      let codes = [];
      try { codes = await detector.detect(v); } catch (e) {}
      if (!scanOpen) return;
      if (codes.length) {
        codes.sort((a, b) => (b.boundingBox.width * b.boundingBox.height) - (a.boundingBox.width * a.boundingBox.height));
        closeScanner(codes[0].rawValue.trim());
        return;
      }
    }
    await new Promise(r => setTimeout(r, 60));
  }
}

async function setTorch(on) {
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); torchOn = on; $('torch').classList.toggle('on', on); } catch (e) {}
}
async function setZoom(z) {
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ zoom: z }] }); zoomOn = z > 1; $('zoom').classList.toggle('on', zoomOn); } catch (e) {}
}

function closeScanner(value) {
  scanOpen = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; track = null; }
  $('vid').srcObject = null;
  $('scan').style.display = 'none';
  if (frozen) $('result').style.display = 'block';
  if (value) {
    $('code').value = value;
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    showDup(findDup(value));
  }
}

// Po uložení / zahodení mimo AR (po skenovaní) sa meranie spustí znova (klik = povolené gesto).
function resumeAR() {
  if (!$('overlay').classList.contains('noar')) return;
  $('overlay').classList.remove('noar');
  $('overlay').style.display = 'none';
  start().then(() => { if (!session) { $('start').style.display = 'flex'; renderLog(); } });
}

function flashResult(msg) {
  const w = $('dupwarn'); w.textContent = msg; w.style.display = 'block';
  setTimeout(() => { if (w.textContent === msg) showDup(findDup($('code').value)); }, 3500);
}

function findDup(code) {
  code = (code || '').trim();
  return code ? records.find(r => (r.code || '').trim() === code) : null;
}
function showDup(r, strong) {
  const w = $('dupwarn');
  if (!r) { w.style.display = 'none'; w.textContent = ''; return; }
  w.textContent = `⚠ Tento balík už je uložený (#${r.n}, ${shortTime(r.time)}, ${r.L}×${r.W}×${r.H} cm).` + (strong ? ' Stlač znova pre uloženie.' : '');
  w.style.display = 'block';
}

// ---------- uložené merania ----------
const STORE = 'meranie-balika-zaznamy';
let records = [];
try { records = JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { records = []; }
function persist() { try { localStorage.setItem(STORE, JSON.stringify(records)); } catch (e) {} }

function saveRecord() {
  if (!frozen) return;
  const cm = v => Math.round(v * 100);
  const L = cm(frozen.length), W = cm(frozen.width), H = cm(frozen.height);
  records.push({
    n: records.length ? records[records.length - 1].n + 1 : 1,
    time: frozen.time.toISOString(),
    L, W, H,
    liters: +(L * W * H / 1000).toFixed(1),
    cat: M.categorize(L, W, H).id,
    volKg: +(L * W * H / 5000).toFixed(1),
    code: $('code').value.trim(),
    note: $('note').value.trim(),
    mode: frozen.mode,
    shape: frozen.shape || '',
  });
  persist();
}

const pad = n => String(n).padStart(2, '0');
function fmtTime(iso) {
  const d = new Date(iso);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function shortTime(iso) { const d = new Date(iso); return `${d.getDate()}.${d.getMonth() + 1}. ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderLog() {
  $('log').style.display = records.length ? 'flex' : 'none';
  if (!records.length) return;
  const totL = records.reduce((a, r) => a + r.liters, 0);
  $('logsum').textContent = `Uložené merania: ${records.length} · spolu ${totL.toFixed(1).replace(".", ",")} l`;
  $('catsum').innerHTML = catStats().filter(c => c.count).map(c =>
    `<span><span class="cat small" style="background:${c.color}">${c.id}</span> ${c.count} ks · ${c.liters.toFixed(1).replace('.', ',')} l</span>`).join('');
  $('logtable').innerHTML = '<table><tr><th>#</th><th>Kat.</th><th>Čas</th><th>D×Š×V cm</th><th>l</th><th>Číslo balíka</th></tr>' +
    records.slice().reverse().map(r => `<tr><td>${r.n}</td><td><span class="cat small" style="background:${catOf(r).color}">${catOf(r).id}</span></td><td>${shortTime(r.time)}</td><td>${r.shape === 'valec' ? '⬭ ' : ''}${r.L}×${r.W}×${r.H}</td><td>${String(r.liters).replace('.', ',')}</td><td>${esc(r.code || '')}${r.note ? ` <span style="color:#999">${esc(r.note)}</span>` : ''}</td></tr>`).join('') +
    '</table>';
}

function catOf(r) { return M.categorize(r.L, r.W, r.H); }
function catStats() {
  return M.CATEGORIES.concat([M.OVERSIZE]).map(c => {
    const rs = records.filter(r => catOf(r).id === c.id);
    return { id: c.id, color: c.color, max: c.max, count: rs.length, liters: rs.reduce((a, r) => a + r.liters, 0) };
  });
}

// CSV pre slovenský Excel: oddeľovač ";", desatinná čiarka, UTF-8 s BOM
function buildCSV() {
  const q = v => { const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = v => String(v).replace('.', ',');
  const rows = [['Poradie', 'Číslo balíka', 'Kategória', 'Dátum a čas', 'Dĺžka (cm)', 'Šírka (cm)', 'Výška (cm)', 'Objem (l)', 'Objemová hmotnosť (kg, ÷5000)', 'Tvar', 'Poznámka', 'Režim']];
  for (const r of records) rows.push([r.n, r.code || '', catOf(r).id, fmtTime(r.time), r.L, r.W, r.H, num(r.liters), num(r.volKg), r.shape || '', r.note, r.mode]);
  const tot = records.reduce((a, r) => a + r.liters, 0);
  rows.push([]);
  rows.push(['Počet balíkov', records.length]);
  rows.push(['Objem spolu (l)', num(tot.toFixed(1))]);
  rows.push([]);
  rows.push(['Kategória', 'Max. rozmery (cm)', 'Počet balíkov', 'Objem spolu (l)', 'Podiel z počtu']);
  for (const c of catStats()) rows.push([c.id, c.max ? c.max.join(' × ') : 'väčšie / dlhšie ako 120', c.count, num(c.liters.toFixed(1)),
    records.length ? num((100 * c.count / records.length).toFixed(1)) + ' %' : '0 %']);
  return '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
}
function csvName() { const d = new Date(); return `merania_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`; }

function exportCSV() {
  const blob = new Blob([buildCSV()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = csvName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function shareCSV() {
  const file = new File([buildCSV()], csvName(), { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Merania balíkov' }); } catch (e) {}
  } else exportCSV();
}
renderLog();

// ---------- hlavná slučka ----------
let centerPoint = null, lastAnyHit = null;
const grid = { cols: GRID_COLS, rows: GRID_ROWS, pts: new Float32Array(GRID_COLS * GRID_ROWS * 3) };

let frameErr = '';
function onFrame(t, frame) {
  if (!session) return;
  session.requestAnimationFrame(onFrame);
  try { frameBody(frame); }
  catch (e) { frameErr = e.message || String(e); $('diag').textContent = 'Chyba: ' + frameErr; }
}

function frameBody(frame) {
  frameNo++;
  const layer = session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);

  const pose = frame.getViewerPose(refSpace);
  if (!pose) { if (frameNo % 10 === 0) $('diag').textContent = 'Sledovanie polohy… pomaly hýb telefónom'; return; }
  const view = pose.views[0];
  const proj = view.projectionMatrix, viewMat = view.transform.matrix;
  lastView = { proj, viewInv: view.transform.inverse.matrix, camY: viewMat[13] };

  // hit-test (podlaha / rohy)
  const hits = frame.getHitTestResults(hitSource);
  const prevHit = !!lastHit;
  lastHit = null; lastAnyHit = null;
  if (hits.length) {
    const m = hits[0].getPose(refSpace).transform.matrix;
    lastAnyHit = [m[12], m[13], m[14]];
    if (Math.abs(m[5]) > 0.9) lastHit = lastAnyHit;   // os Y zásahu ≈ normála; horizontálna plocha
  }
  if (prevHit !== !!lastHit && floorY === null) updateUI();

  // hĺbka
  centerPoint = null; depthFloor = null;
  let depth = null;
  if (depthOK) { try { depth = frame.getDepthInformation(view); } catch (e) { depth = null; } }
  if (depth) {
    const invProj = M.invert(proj);
    const d0 = safeDepth(depth, 0.5, 0.5);
    if (d0) centerPoint = M.unproject(invProj, viewMat, 0.5, 0.5, d0);
    depthFrames++; if (d0) depthValid++;
    if (floorY === null) depthFloor = flatPatch(depth, invProj, viewMat);

    if (!manual && floorY !== null && !frozen) {
      for (let r = 0; r < GRID_ROWS; r++) for (let c = 0; c < GRID_COLS; c++) {
        const u = (c + 0.5) / GRID_COLS, v = (r + 0.5) / GRID_ROWS;
        const d = safeDepth(depth, u, v);
        const k = (r * GRID_COLS + c) * 3;
        if (d) { const p = M.unproject(invProj, viewMat, u, v, d); grid.pts[k] = p[0]; grid.pts[k+1] = p[1]; grid.pts[k+2] = p[2]; }
        else grid.pts[k] = grid.pts[k+1] = grid.pts[k+2] = NaN;
      }
      refineFloor();
      const det = M.detectBox(grid, floorY);
      const had = !!latest, prevHint = hintKey();
      let acc = null;
      if (det) {
        // odmietni snímky, ktoré sa výrazne líšia od doterajšieho mediánu (skoky)
        const ref = history.length >= 5 ? M.aggregate(history) : null;
        const near = (a, b) => Math.abs(a - b) < Math.max(0.03, 0.15 * b);
        if (!ref || (near(det.length, ref.length) && near(det.width, ref.width) && near(det.height, ref.height))) { acc = det; rejects = 0; }
        else if (++rejects > 15) { history = []; acc = det; rejects = 0; }   // asi iný balík
      }
      if (acc) {
        latest = acc; lastSeen = frameNo;
        history.push(acc); if (history.length > HISTORY) history.shift();
        const cx = (acc.corners[0][0] + acc.corners[2][0]) / 2, cz = (acc.corners[0][1] + acc.corners[2][1]) / 2;
        boxDist = Math.hypot(viewMat[12] - cx, viewMat[13] - (floorY + acc.height / 2), viewMat[14] - cz);
        if (collecting) {
          collecting.push(acc);
          if (collecting.length >= FINAL_SAMPLES) { const r = M.aggregate(collecting); collecting = null; showResult(r); }
        }
      } else if (frameNo - lastSeen > 15) { latest = null; boxDist = null; }
      const st = !!latest && !latest.cut && isStable();
      if (had !== !!latest || prevHint !== hintKey() || st !== stable) { stable = st; updateUI(); }
    }
  }
  if (floorY === null) autoFloor();
  if (frameNo % 10 === 0) diag(hits.length);
  draw();
}

// Bod pod krížikom: z hĺbkovej mapy, inak z hit-testu (akákoľvek plocha).
function targetPoint() { return centerPoint || lastAnyHit; }

// ---------- podlaha ----------
let depthFloor = null;
function floorGuess() { return lastHit ? lastHit[1] : depthFloor; }

function setFloor(y, src) {
  floorY = y; floorSrc = src; floorCand = [];
  if (navigator.vibrate) navigator.vibrate(60);
  updateUI();
}

// Rovná plocha v strede obrazu z hĺbkovej mapy -> výška podlahy (záloha, keď ARCore nenájde rovinu).
function flatPatch(depth, invProj, viewMat) {
  const ys = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const u = 0.35 + c * 0.3 / 8, v = 0.45 + r * 0.3 / 8;
    const d = safeDepth(depth, u, v);
    if (d) ys.push(M.unproject(invProj, viewMat, u, v, d)[1]);
  }
  if (ys.length < 50) return null;
  ys.sort((a, b) => a - b);
  const spread = M.percentile(ys, 0.9) - M.percentile(ys, 0.1);
  // plocha musí byť rovná a pod telefónom aspoň 30 cm
  return spread < 0.03 && lastView && M.percentile(ys, 0.5) < lastView.camY - 0.3 ? M.percentile(ys, 0.5) : null;
}

// Podlaha sa nastaví sama, keď je výška stabilná ~0,5 s.
function autoFloor() {
  const g = floorGuess();
  if (g === null) { floorCand = []; return; }
  floorCand.push(g); if (floorCand.length > 15) floorCand.shift();
  if (floorCand.length === 15 && Math.max(...floorCand) - Math.min(...floorCand) < 0.015)
    setFloor(M.median(floorCand), lastHit ? 'rovina' : 'hĺbka');
}

function diag(nHits) {
  const ok = v => v ? '✓' : '✗';
  $('diag').textContent = `hĺbka ${depthOK ? (depthFrames ? Math.round(100 * depthValid / depthFrames) + '%' : '…') : 'nepodporovaná'}` +
    ` · rovina ${ok(nHits)}${nHits && !lastHit ? ' (nie vodorovná)' : ''}` +
    ` · podlaha ${floorY === null ? '✗' : '✓ ' + floorSrc}`;
  depthFrames = depthValid = 0;
}

function hintKey() {
  return !latest ? 0 : latest.cut ? 4 : boxDist === null ? 1 : boxDist < DIST_MIN ? 2 : boxDist > distMax() ? 3 : 1;
}

function isStable() {
  if (history.length < STABLE_N) return false;
  const last = history.slice(-STABLE_N);
  return ['length', 'width', 'height'].every(k => {
    const v = last.map(m => m[k]);
    return Math.max(...v) - Math.min(...v) <= STABLE_TOL;
  });
}

// Podlaha sa priebežne spresňuje z hĺbkovej mapy (ARCore ju časom mierne posúva).
function refineFloor() {
  const ys = [];
  const pts = grid.pts;
  for (let i = 1; i < pts.length; i += 3 * 3) {   // každý 3. bod
    const y = pts[i];
    if (y === y && Math.abs(y - floorY) < 0.03) ys.push(y);
  }
  if (ys.length > 150) floorY += (M.median(ys) - floorY) * 0.1;
}

function safeDepth(depth, u, v) {
  try {
    const d = depth.getDepthInMeters(u, v);
    return d > 0.15 && d < 4 ? d : 0;
  } catch (e) { return 0; }
}

// ---------- kreslenie ----------
function toScreen(p) {
  if (!lastView) return null;
  const v = M.mulVec(lastView.viewInv, p[0], p[1], p[2], 1);
  const c = M.mulVec(lastView.proj, v[0], v[1], v[2], 1);
  if (c[3] <= 0.01) return null;
  return [(c[0] / c[3] + 1) / 2 * innerWidth, (1 - c[1] / c[3]) / 2 * innerHeight];
}

function line(a, b, color, w) {
  const A = toScreen(a), B = toScreen(b);
  if (!A || !B) return;
  ctx.strokeStyle = color; ctx.lineWidth = w || 3;
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
}

function label(p, text) {
  const s = toScreen(p); if (!s) return;
  ctx.font = '700 16px system-ui'; const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(s[0] - w / 2, s[1] - 12, w, 24);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, s[0], s[1]);
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const cx = innerWidth / 2, cy = innerHeight / 2;

  // krížik v strede + bod: žltý = povrch rozpoznaný, červený krúžok = nič
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 22, cy); ctx.lineTo(cx - 8, cy); ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + 22, cy);
  ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy - 8); ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + 22); ctx.stroke();
  if (targetPoint()) { ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill(); }
  else { ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.stroke(); }

  // značka zásahu podlahy
  const ring = floorY === null || manual ? (lastHit || (floorY === null && depthFloor !== null && centerPoint ? [centerPoint[0], depthFloor, centerPoint[2]] : null)) : null;
  if (ring) {
    const pts = [];
    for (let i = 0; i <= 32; i++) { const a = i / 32 * Math.PI * 2; pts.push([ring[0] + Math.cos(a) * 0.05, ring[1], ring[2] + Math.sin(a) * 0.05]); }
    for (let i = 0; i < 32; i++) line(pts[i], pts[i + 1], '#3ddc84', 3);
  }

  if (manual) { drawManual(); return; }

  const box = latest;
  if (!box || floorY === null) return;
  const agg = M.aggregate(history) || box;
  const color = collecting ? '#ffcc00' : '#3ddc84';
  const b = box.corners.map(([x, z]) => [x, floorY, z]);
  const t = box.corners.map(([x, z]) => [x, floorY + agg.height, z]);
  for (let i = 0; i < 4; i++) {
    line(b[i], b[(i + 1) % 4], color, 3);
    line(t[i], t[(i + 1) % 4], color, 3);
    line(b[i], t[i], color, 3);
  }
  const cm = v => Math.round(v * 100);
  $('live').textContent = `${agg.shape === 'valec' ? '⬭ ' : ''}${cm(agg.length)} × ${cm(agg.width)} × ${cm(agg.height)} cm`;
  $('live').style.display = frozen ? 'none' : 'block';
}

function drawManual() {
  const pts = manualPts.slice();
  for (let i = 0; i < pts.length; i++) {
    const s = toScreen(pts[i]); if (!s) continue;
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(s[0], s[1], 7, 0, 7); ctx.fill();
  }
  const cm = (p, q) => Math.round(Math.hypot(p[0] - q[0], p[2] - q[2]) * 100) + ' cm';
  if (pts.length >= 2) { line(pts[0], pts[1], '#ffcc00'); label(mid(pts[0], pts[1]), cm(pts[0], pts[1])); }
  if (pts.length >= 3) { line(pts[1], pts[2], '#ffcc00'); label(mid(pts[1], pts[2]), cm(pts[1], pts[2])); }
  // živý náhľad ďalšej úsečky / výšky
  const tp = targetPoint();
  if (!frozen && tp && pts.length && pts.length < 3) {
    line(pts[pts.length - 1], tp, 'rgba(255,204,0,.6)', 2);
    label(mid(pts[pts.length - 1], tp), Math.round(Math.hypot(tp[0] - pts[pts.length - 1][0], tp[2] - pts[pts.length - 1][2]) * 100) + ' cm');
  }
  if (!frozen && tp && pts.length === 3) label(tp, 'V ' + Math.round((tp[1] - manualFloor()) * 100) + ' cm');
}
function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]; }
</script>
</body>
</html>
